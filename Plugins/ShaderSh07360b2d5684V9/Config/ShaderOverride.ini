; ---------------------------------------------------------------------------

[BRDF.ush]
+Define=(DefineName="CUSTOM_DIFFUSE_MODE", DisplayName="Diffuse BRDF", Description="Diffuse shading model (controlled by dropdown above). 0=Engine Default, 1=Oren-Nayar, 2=Burley, 3=Lambert-Sphere, 4=Gotanda, 5=Callisto, 6=Proxima, 7=Regolith (micrograin dust layer)", DefaultValue="0")
+Define=(DefineName="CUSTOM_SPEC_MODE", DisplayName="Specular BRDF", Description="Specular shading model (controlled by dropdown above). 0=Engine Default (Single-Lobe GGX), 1=Multi-Lobe Cinematic, 2=Callisto Modified Dual GGX, 3=Regolith Sheen (dust layer). Modes 1 and 3 apply per-model dual-lobe energy compensation to the diffuse automatically.", DefaultValue="0")
+Define=(DefineName="CUSTOM_SPEC_PRIMARY_WEIGHT", DisplayName="Specular Primary Weight", Description="Weight of the primary (sharp) lobe.  Secondary gets (1 - this).  Range 0.0 - 1.0", DefaultValue="0.7")
+Define=(DefineName="CUSTOM_SPEC_PRIMARY_ROUGHNESS_SCALE", DisplayName="Primary Roughness Scale", Description="Roughness multiplier for the sharp primary lobe.  < 1.0 = tighter than material roughness", DefaultValue="0.45")
+Define=(DefineName="CUSTOM_SPEC_SECONDARY_ROUGHNESS_SCALE", DisplayName="Secondary Roughness Scale", Description="Roughness multiplier for the soft secondary lobe.  > 1.0 = wider than material roughness", DefaultValue="2.2")
+Define=(DefineName="CUSTOM_SPEC_SECONDARY_MAX_ROUGHNESS", DisplayName="Secondary Max Roughness", Description="Clamp for the secondary lobe to avoid extreme blur.  Range 0.0 - 1.0", DefaultValue="0.95")

