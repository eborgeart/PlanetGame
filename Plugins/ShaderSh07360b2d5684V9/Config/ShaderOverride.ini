; ---------------------------------------------------------------------------
; Bloom shaders — single CUSTOM_BLOOM_MODE drives all four bloom-pipeline
; files.  They all #include BloomShift.ush and dispatch through the matching
; BloomShift_* function for their stage.  Setting CUSTOM_BLOOM_MODE to 0
; restores the engine default for every stage.
; ---------------------------------------------------------------------------

[PostProcessBloom.usf]
+Define=(DefineName="CUSTOM_BLOOM_MODE", DisplayName="Bloom Mode", Description="Bloom kernel/look (controlled by dropdown above). 0=Engine, 1=Dual Kawase, 2=COD Scatter-as-Gather, 3=FFT Diffraction, 4=Anamorphic Streak, 5=Spencer Ocular, 6=Anime Hard Glow, 7=Retro CRT", DefaultValue="0")

[BloomResizeKernel.usf]
+Define=(DefineName="CUSTOM_BLOOM_MODE", DisplayName="Bloom Mode", Description="Procedural FFT bloom kernel (active when bloom mode = 3 or 5)", DefaultValue="0")

; ---------------------------------------------------------------------------
; VolumetricFog.usf — phase function dispatcher + powder + R2 jitter
;
; Single template hooks /Engine/Private/VolumetricFog.usf.  All defines below
; are no-ops when at their engine-default values, so the override compiles to
; byte-equivalent output of the stock 5.7 shader when the user picks "Engine
; Default" everywhere.
;
; CUSTOM_VOL_PHASE_MODE dispatches all four PhaseFunction() call sites
; (directional, sky-SH, forward local lights, shadowed local lights).
;
; CUSTOM_VOL_POWDER_BLEND adds the Schneider 2015 silver-lining glow to the
; final integration pass.  0 = engine Beer-Lambert only; ~0.5 = cinematic.
;
; CUSTOM_VOL_BLUE_NOISE swaps the per-supersample PCG hash for a Martin
; Roberts R2 quasirandom sequence (better TAA absorption, zero perf cost).
; ---------------------------------------------------------------------------

[VolumetricFog.usf]
+Define=(DefineName="CUSTOM_VOL_PHASE_MODE", DisplayName="Volumetric Phase", Description="Volumetric fog phase function (controlled by dropdown above). 0=Engine HG, 1=Schlick, 2=Cornette-Shanks, 3=Dual-Lobe HG, 4=Jendersie-d'Eon Mie-Approx", DefaultValue="0")
+Define=(DefineName="CUSTOM_VOL_MS_OCTAVES", DisplayName="Multi-Scatter Octaves", Description="Phase B Wrenninge/Frostbite multi-octave scattering. 0=off (single scattering), 2=subtle, 3=recommended, 4=cinematic. Synthesised from the Multi-Scattering Octaves dropdown.", DefaultValue="0")
+Define=(DefineName="CUSTOM_VOL_SELF_SHADOW_STEPS", DisplayName="Self-Shadow Steps", Description="Phase A self-shadowing through fog. Integer step count for the secondary ray-march toward the sun, sampling the density volume (VBufferA). 0=off (engine default), 4=fast, 8=balanced, 16=cinematic. Synthesised from the Self-Shadow Steps dropdown.", DefaultValue="0")
+Define=(DefineName="CUSTOM_VOL_PHASE_G2", DisplayName="Dual-Lobe Secondary G", Description="Secondary anisotropy for Dual-Lobe HG (mode 3). Range -1..1. -0.3 = backscatter halo, +0.95 = sharp forward peak.", DefaultValue="-0.3")
+Define=(DefineName="CUSTOM_VOL_PHASE_BLEND", DisplayName="Dual-Lobe Blend", Description="Blend between primary and secondary lobes for Dual-Lobe HG (mode 3). 0 = primary only, 1 = secondary only. Typical value: 0.3", DefaultValue="0.3")
+Define=(DefineName="CUSTOM_VOL_MIE_DROPLET_UM", DisplayName="Mie Droplet (μm)", Description="Droplet diameter in micrometers for Mie-Approx phase function (mode 4). 5=fine mist, 15=fog, 50=light cloud, 100+=dense cloud", DefaultValue="15.0")
+Define=(DefineName="CUSTOM_VOL_POWDER_BLEND", DisplayName="Powder Edge Glow", Description="Schneider 2015 silver-lining term applied in final integration. 0 = engine Beer-Lambert only. ~0.5 gives the characteristic cinematic glow at fog/cloud edges.", DefaultValue="0.0")
+Define=(DefineName="CUSTOM_USE_POWDER", DisplayName="(internal) Powder Enabled", Description="Internal integer toggle. Automatically set to 1 when Powder Edge Glow > 0, otherwise 0. Synthesised by the editor/runtime modules so the shader can preprocessor-strip the powder math when off (HLSL #if needs an int). Do not edit directly.", DefaultValue="0")
+Define=(DefineName="CUSTOM_VOL_SPECTRAL_STRENGTH", DisplayName="Spectral Strength", Description="Phase C atmospheric spectral tint. 0=off, 1=physical-ish, 2=exaggerated cinematic. Modulates directional light contribution by per-wavelength Rayleigh extinction based on sun elevation.", DefaultValue="0.0")
+Define=(DefineName="CUSTOM_USE_SPECTRAL", DisplayName="(internal) Spectral Enabled", Description="Internal integer toggle. Automatically set to 1 when Spectral Strength > 0, otherwise 0. Synthesised by the editor/runtime modules so the shader can preprocessor-strip the spectral math when off (HLSL #if needs an int). Do not edit directly.", DefaultValue="0")
+Define=(DefineName="CUSTOM_VOL_BLUE_NOISE", DisplayName="R2 Quasirandom Jitter", Description="Replaces per-supersample PCG hash with Martin Roberts R2 quasirandom sequence. R2 has a blue-noise-like spectrum that TAA absorbs more cleanly. 0=Engine PCG, 1=R2", DefaultValue="0")


