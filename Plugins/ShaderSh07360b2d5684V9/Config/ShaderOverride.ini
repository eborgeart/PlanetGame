; ---------------------------------------------------------------------------
; PostProcessAmbientOcclusion.usf -- Ambient Occlusion algorithm selector
;
; A single CUSTOM_AO_MODE drives the dispatch site at the top of both
; MainPSandCS (legacy SSAO path) and GTAOCombinedPSandCS (GTAO path).  At 0
; the patched shader produces byte-equivalent output of the stock engine
; shader; at 1+ the SSILVB visibility-bitmask trace replaces the horizon
; accumulation.
;
; CUSTOM_AO_MODE values (kept in sync with ECustomAOMode in
; ShaderShiftSettings.h):
;     0 = Engine Default (SSAO / GTAO unchanged)
;     1 = SSILVB (Screen Space Indirect Lighting with Visibility Bitmask)
; ---------------------------------------------------------------------------

[PostProcessAmbientOcclusion.usf]
+Define=(DefineName="CUSTOM_AO_MODE", DisplayName="AO Method", Description="Ambient occlusion algorithm (controlled by dropdown above). 0=Engine Default (SSAO/GTAO), 1=SSILVB (Visibility Bitmask).", DefaultValue="0")


; ---------------------------------------------------------------------------
; SSRT/SSRTDiffuseIndirect.usf -- Screen-Space GI algorithm selector
;
; CUSTOM_SSGI_MODE drives the dispatch site at the top of MainCS in the
; DIFFUSE_TERM specialisation of the SSGI compute shader.  At 0 the patched
; shader produces byte-equivalent output of the stock engine shader; at 1+
; the SSILVB visibility-bitmask GI trace replaces the Hammersley ray cast.
;
; The shader runs only when r.SSGI.Enable=1 AND Lumen GI is disabled
; (r.DynamicGlobalIlluminationMethod = 0 or 2).  With Lumen GI active the
; engine takes a different path and this hook has no effect.
;
; CUSTOM_SSGI_MODE values (kept in sync with ECustomSSGIMode in
; ShaderShiftSettings.h):
;     0 = Engine Default (Stochastic SSRT)
;     1 = SSILVB (Visibility-Bitmask Indirect Diffuse + AO)
; ---------------------------------------------------------------------------

[SSRTDiffuseIndirect.usf]
+Define=(DefineName="CUSTOM_SSGI_MODE", DisplayName="SSGI Method", Description="Screen-space GI algorithm. 0=Engine Default (Stochastic SSRT), 1=SSILVB (Visibility Bitmask Indirect Diffuse), 2=Diagnostic (magenta tint to verify hook is active), 3=Stable SSGI (engine ray cast with frame-stable sample directions plus tile-local bilateral denoiser for TSR-friendly output). Requires r.DynamicGlobalIlluminationMethod=2 and r.SSGI.Enable=1.", DefaultValue="0")
+Define=(DefineName="CUSTOM_SSGI_RAY_MULTIPLIER", DisplayName="SSGI Sample Multiplier", Description="Per-lane supersampling multiplier for SSILVB (Mode 1, extra hemisphere slices) and Stable SSGI (Mode 3, extra Hammersley rays). The tile bilateral averages across all lanes so the effective sample count scales by N. 1=baseline, 2/4/8 = sqrt(N) less noise at linear cost.", DefaultValue="1")
+Define=(DefineName="CUSTOM_SSGI_INTENSITY", DisplayName="SSILVB Intensity", Description="SSILVB GI brightness multiplier (controlled by slider in the Quick Panel). The slice estimator is pi/2-normalised in-shader so 1.0 = engine-parity brightness; 2.0 (default) compensates for the emitter-cosine weighting stock SSGI lacks. Tune ~1-4. Only takes effect when CUSTOM_SSGI_MODE==1 (SSILVB).", DefaultValue="2.0")

; ---------------------------------------------------------------------------
; PostProcessTonemap.usf -- Film Halation + Organic Grain (ShaderShift v1.1)
;
; Two independent post-tonemap effects.  The SHADERSHIFT_* gates are integer
; toggles synthesised from the bFilmHalation / bOrganicGrain checkboxes; the
; CUSTOM_* values are the per-effect tunables.  DefaultValues MUST match the
; #define defaults in the patched shader so a fresh/disabled install stays
; byte-equivalent to stock UE 5.7.  Without this section the hook carries an
; empty Defines array and the toggles never reach the patched shader.
; ---------------------------------------------------------------------------

[PostProcessTonemap.usf]
+Define=(DefineName="SHADERSHIFT_FILM_HALATION", DisplayName="Film Halation", Description="Enable post-tonemap red-highlight bleed (synthesised from the Enable Film Halation checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_HALATION_THRESHOLD", DisplayName="Halation Threshold", Description="Exposure-corrected luminance above which highlights bleed. ~1.0 = tonemapper white.", DefaultValue="0.8")
+Define=(DefineName="CUSTOM_HALATION_STRENGTH", DisplayName="Halation Strength", Description="Overall amount of the red-skewed halation bleed.", DefaultValue="0.25")
+Define=(DefineName="CUSTOM_HALATION_SPREAD", DisplayName="Halation Spread", Description="Gather radius (texels x4) of the highlight neighbourhood that bleeds into each pixel.", DefaultValue="1.0")
+Define=(DefineName="SHADERSHIFT_ORGANIC_GRAIN", DisplayName="Organic Grain", Description="Enable midtone-weighted chromatic film grain (synthesised from the Enable Organic Grain checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_GRAIN_STRENGTH", DisplayName="Grain Strength", Description="Amount of per-channel grain offset.", DefaultValue="0.12")
+Define=(DefineName="CUSTOM_GRAIN_SCALE", DisplayName="Grain Scale", Description="Grain cell size. >1 = finer grain, <1 = coarser.", DefaultValue="1.0")

; ---------------------------------------------------------------------------
; TemporalAA.usf -- Legacy TAA ghosting/flicker tweak + sharpen (v1.1)
; ---------------------------------------------------------------------------

[TemporalAA.usf]
+Define=(DefineName="SHADERSHIFT_TAA_GHOSTING_TWEAK", DisplayName="TAA Ghosting Tweak", Description="Rescale the history-clamp neighbour AABB to trade ghosting vs flicker (from the Enable Ghosting Tweak checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_TAA_CLAMP_FACTOR", DisplayName="Clamp Factor", Description="AABB extent multiplier. 1.0=engine, <1=less ghosting/more aliasing, >1=smoother/more ghosting.", DefaultValue="1.0")
+Define=(DefineName="SHADERSHIFT_TAA_SHARPEN", DisplayName="TAA Sharpen", Description="Apply a cheap temporal-contrast sharpen after the clamp (from the Enable TAA Sharpen checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_TAA_SHARPEN_STRENGTH", DisplayName="Sharpen Strength", Description="Strength of the post-clamp sharpen.", DefaultValue="0.4")

; ---------------------------------------------------------------------------
; LumenScreenProbeGather.usf -- spatial neighbour-probe RIS resample (v1.2)
;
; CUSTOM_RESTIR_SEARCH_RADIUS is a true probe-grid spatial search radius: the
; resample covers the 4 bilinear corner probes PLUS a 4-tap cross of grid
; probes this many tiles out (plane-distance rejection).  The shader derives
; its compile-time tap radius directly from the define, so the v1.1
; SHADERSHIFT_RESTIR_LINEAR_WEIGHT auxiliary gate no longer exists.
; ---------------------------------------------------------------------------

[LumenScreenProbeGather.usf]
+Define=(DefineName="SHADERSHIFT_RESTIR_GI_PROBES", DisplayName="ReSTIR GI Probes", Description="Enable the spatial neighbour-probe reservoir resample on the Lumen screen-probe gather (from the Enable ReSTIR Probes checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_RESTIR_STRENGTH", DisplayName="ReSTIR Strength", Description="Blend between engine GI (0) and the importance-resampled correction (1).", DefaultValue="0.5")
+Define=(DefineName="CUSTOM_RESTIR_SEARCH_RADIUS", DisplayName="ReSTIR Search Radius", Description="Spatial-reuse search radius in probe-grid tiles (~16px each) for the 4-tap cross of extended neighbour probes. Rounded to a whole tile count (1..4) at compile time.", DefaultValue="1.0")

; ---------------------------------------------------------------------------
; LumenReflectionCommon.ush -- Gradient reflection filter gate + tunables.
;
; The #define lines live in this shared header; LumenReflectionDenoiserSpatial
; .usf consumes them via #include, so only this file's hook patches the
; defines (the denoiser hook still applies for its own shader-body override).
; ---------------------------------------------------------------------------

[LumenReflectionCommon.ush]
+Define=(DefineName="SHADERSHIFT_GRADIENT_REFLECTION_FILTER", DisplayName="Gradient Reflection Filter", Description="Enable the sharp-trace + gradient-domain bilateral reflection reconstruction (from the Enable Gradient Reflection Filter checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_GRAD_REFL_STRENGTH", DisplayName="Gradient Filter Strength", Description="Blend between the engine bilateral weight (0) and the roughness-driven gradient weight (1).", DefaultValue="0.6")
+Define=(DefineName="CUSTOM_GRAD_REFL_ROUGHNESS_BIAS", DisplayName="Roughness Bias", Description="Scales the roughness-driven acceptance spread. Higher = wider blur on rough surfaces.", DefaultValue="1.0")
+Define=(DefineName="CUSTOM_GRAD_REFL_SHARP_TRACE", DisplayName="Sharp Trace Amount", Description="How far the tracing roughness is pulled toward mirror (sharp 1-spp trace; the spatial denoiser still sees true roughness and reconstructs the rough appearance). 0=engine trace, 1=full mirror.", DefaultValue="0.5")

; ---------------------------------------------------------------------------
; VirtualShadowMapProjectionFilter.ush -- Contact-aware VSM penumbra (v1.1)
; ---------------------------------------------------------------------------

[VirtualShadowMapProjectionFilter.ush]
+Define=(DefineName="SHADERSHIFT_CONTACT_AWARE_SHADOWS", DisplayName="Contact-Aware VSM Shadows", Description="Drive VSM penumbra width from the real SMRT occluder distance: closer occluder = harder contact (from the Enable Contact-Aware VSM Shadows checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_SHADOW_HARDENING_STRENGTH", DisplayName="Hardening Strength", Description="Lerp between the engine-filtered VSM result (0) and the contact-hardened curve (1).", DefaultValue="0.5")
+Define=(DefineName="CUSTOM_SHADOW_SOFTNESS_MULTIPLIER", DisplayName="Softness Distance Scale", Description="World-space distance scale before normalisation. 1.0 = 100cm to full softness; <1 harder, >1 softer.", DefaultValue="1.0")

; ---------------------------------------------------------------------------
; TSRUpdateHistory.usf -- TSR equivalent of the legacy-TAA ghosting tweak.
;
; UE5 projects default to TSR (or another non-legacy AA method), in which case
; TemporalAA.usf is NEVER dispatched and its hook has no visible effect.  This
; hook applies the SAME ghosting/flicker AABB rescale at TSR's high-frequency
; history-clamp site, driven by the SAME bTaaGhostingTweak / Clamp Factor
; settings.  (TSR has its own sharpening, so there is no TAA-sharpen gate here.)
; ---------------------------------------------------------------------------

[TSRUpdateHistory.usf]
+Define=(DefineName="SHADERSHIFT_TAA_GHOSTING_TWEAK", DisplayName="TAA/TSR Ghosting Tweak", Description="Trade ghosting vs stability in TSR (from the Enable Ghosting Tweak checkbox). 0=off, 1=on.", DefaultValue="0")
+Define=(DefineName="CUSTOM_TAA_CLAMP_FACTOR", DisplayName="Clamp Factor", Description="Drives three TSR hooks: the history-clamp AABB extent, the velocity-driven history invalidation rate (1/factor), and the contrast-stability floor that normally keeps ghost trails alive. 1.0=engine, <1=stronger ghost rejection/more flicker under motion, >1=smoother/more ghosting. Typical anti-ghosting value 0.4-0.7.", DefaultValue="1.0")

