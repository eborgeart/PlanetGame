; BRDF = Callisto Modified Dual GGX (CUSTOM_SPEC_MODE 2).  NEUTRAL == ENGINE:
; with DiffFresnel=Retro=1, SmoothTerm=0, DualSpecOpacity=0 and
; SpecFresnelFalloff=1 the Callisto BRDF reduces exactly to Lambert + GGX.
+Define=(DefineName="CALLISTO_DIFF_FRESNEL", DisplayName="Diffuse Fresnel", Description="Diffuse Fresnel intensity (rho_f). 1 = neutral. Range 0..256.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_DIFF_FRESNEL_FALLOFF", DisplayName="Diffuse Fresnel Falloff", Description="n_f [0,1], higher = wider.", DefaultValue="0.75")
+Define=(DefineName="CALLISTO_DIFF_FRESNEL_TAN_FALLOFF", DisplayName="Diffuse Fresnel Tangent Falloff", Description="m_f [0,1].", DefaultValue="0.75")
+Define=(DefineName="CALLISTO_DIFF_FRESNEL_TINT_R", DisplayName="Diffuse Fresnel Tint R", Description="Diffuse Fresnel tint red. 1 = white.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_DIFF_FRESNEL_TINT_G", DisplayName="Diffuse Fresnel Tint G", Description="Diffuse Fresnel tint green. 1 = white.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_DIFF_FRESNEL_TINT_B", DisplayName="Diffuse Fresnel Tint B", Description="Diffuse Fresnel tint blue. 1 = white.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_RETRO", DisplayName="Retroreflection", Description="Retroreflection intensity (rho_r). 1 = neutral. Range 0..256.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_RETRO_FALLOFF", DisplayName="Retroreflection Falloff", Description="n_r [0,1].", DefaultValue="0.75")
+Define=(DefineName="CALLISTO_RETRO_TAN_FALLOFF", DisplayName="Retroreflection Tangent Falloff", Description="m_r [0,1].", DefaultValue="0.75")
+Define=(DefineName="CALLISTO_RETRO_TINT_R", DisplayName="Retroreflection Tint R", Description="Retroreflection tint red.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_RETRO_TINT_G", DisplayName="Retroreflection Tint G", Description="Retroreflection tint green.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_RETRO_TINT_B", DisplayName="Retroreflection Tint B", Description="Retroreflection tint blue.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_SMOOTH_TERM", DisplayName="Smooth Terminator", Description="Smooth Terminator intensity (o) [-1,1]. 0 = neutral.", DefaultValue="0.0")
+Define=(DefineName="CALLISTO_SMOOTH_TERM_LENGTH", DisplayName="Smooth Terminator Length", Description="Smooth Terminator length (p) [0,1].", DefaultValue="0.5")
+Define=(DefineName="CALLISTO_SMOOTH_TERM_TINT_R", DisplayName="Smooth Terminator Tint R", Description="Smooth Terminator tint red.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_SMOOTH_TERM_TINT_G", DisplayName="Smooth Terminator Tint G", Description="Smooth Terminator tint green.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_SMOOTH_TERM_TINT_B", DisplayName="Smooth Terminator Tint B", Description="Smooth Terminator tint blue.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_SPEC_FRESNEL_FALLOFF", DisplayName="Specular Fresnel Falloff", Description="n_s [0,1]. 1 = exact Schlick (engine). Paper panel default 0.5.", DefaultValue="1.0")
+Define=(DefineName="CALLISTO_DUAL_SPEC_ROUGHNESS_SCALE", DisplayName="Dual Specular Roughness Scale", Description="Secondary GGX lobe roughness multiplier (CUSTOM_SPEC_MODE 2). Paper range 2..14.", DefaultValue="2.0")
+Define=(DefineName="CALLISTO_DUAL_SPEC_OPACITY", DisplayName="Dual Specular Opacity", Description="Weight of the secondary spec lobe [0,1]. 0 = single lobe (engine).", DefaultValue="0.0")
+Define=(DefineName="CALLISTO_PROXIMA_ALPHA_SCALE", DisplayName="Proxima Roughness Scale", Description="Scales the diffuse roughness fed to the Proxima diffuse model (CUSTOM_DIFFUSE_MODE 6).", DefaultValue="1.0")
; --- Regolith micrograin dust layer [after Lucas et al. 2023/2024] ----------
; Diffuse = CUSTOM_DIFFUSE_MODE 7, specular = CUSTOM_SPEC_MODE 3.  Coverage 0
; reduces both to the engine result exactly; the visible defaults below give
; an immediate dusty veil when a Regolith mode is selected.
+Define=(DefineName="REGOLITH_COVERAGE", DisplayName="Regolith Dust Coverage", Description="Micrograin coverage CEILING tau [0,1]. Each pixel's roughness gates how much it holds: light dust settles only on rough surfaces (polished sheds it), heavy dust buries everything. Grazing views/lights see progressively more dust (Beer-Lambert projected coverage). 0 = engine-exact.", DefaultValue="0.35")
+Define=(DefineName="REGOLITH_GRAIN_ROUGHNESS", DisplayName="Regolith Grain Roughness", Description="Roughness of the dust sheen specular lobe [0.05,1].", DefaultValue="0.6")
+Define=(DefineName="REGOLITH_RETRO", DisplayName="Regolith Opposition Glow", Description="Retro-reflective surge when the light sits behind the viewer (lunar-dust heiligenschein) [0,2].", DefaultValue="0.8")
+Define=(DefineName="REGOLITH_SHEEN", DisplayName="Regolith Dust Sheen", Description="Gain of the grain specular lobe replacing the base gloss under dust [0,2]. 0 = chalk-dead.", DefaultValue="0.6")
+Define=(DefineName="REGOLITH_ROUGHNESS_AFFINITY", DisplayName="Dust Roughness Affinity", Description="1 = dust holds on rough surfaces only (previous behavior), 0 = coverage applies flat. Scales how strongly per-pixel roughness gates the Dust Coverage ceiling.", DefaultValue="1.0")
+Define=(DefineName="REGOLITH_TINT_R", DisplayName="Regolith Tint R", Description="Dust albedo tint target, red.", DefaultValue="1.0")
+Define=(DefineName="REGOLITH_TINT_G", DisplayName="Regolith Tint G", Description="Dust albedo tint target, green.", DefaultValue="1.0")
+Define=(DefineName="REGOLITH_TINT_B", DisplayName="Regolith Tint B", Description="Dust albedo tint target, blue.", DefaultValue="1.0")
+Define=(DefineName="REGOLITH_TINT_BLEND", DisplayName="Regolith Tint Blend", Description="Dust albedo source: 0 = base color (dusty self), 1 = pure tint (chalk/rust/verdigris).", DefaultValue="0.0")
+Define=(DefineName="CALLISTO_PER_MATERIAL_TUNING", DisplayName="Per-Material Tuning (hijacks Specular)", Description="1 = decode per-material Diffuse Fresnel multipliers from the Specular channel (set by the Callisto Per-Material Tuning material node). Repurposes the Specular channel on tagged materials. 0 = global only.", DefaultValue="0")
+Define=(DefineName="CALLISTO_PER_MATERIAL_SELECT", DisplayName="Per-Material BRDF Selection", Description="1 = a material tagged with the Callisto BRDF Select node overrides the global Diffuse/Specular BRDF mode per-material (preset 0..7 transported in reserved Substrate BSDF state bits; Complex path / sg.ShadingQuality 2 required). Adds a runtime BRDF switch to the lighting shader. 0 = global compile-time BRDF only (no cost).", DefaultValue="0")

; ---------------------------------------------------------------------------
