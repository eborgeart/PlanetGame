+Shader=(VirtualPath="/Engine/Private/MaterialTemplate.ush", TemplateFilename="MaterialTemplate.ush", DisplayName="Live Tweaks (material overrides guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/DeferredShadingCommon.ush", TemplateFilename="DeferredShadingCommon.ush", DisplayName="Live Tweaks (GBuffer decode guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/GBufferHelpers.ush", TemplateFilename="GBufferHelpers.ush", DisplayName="Live Tweaks (GBuffer helpers guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/ClearCoatCommon.ush", TemplateFilename="ClearCoatCommon.ush", DisplayName="Live Tweaks (clear coat guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/Substrate/Substrate.ush", TemplateFilename="Substrate/Substrate.ush", DisplayName="Live Tweaks (Substrate sanitize guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/Lumen/LumenDiffuseColorBoost.ush", TemplateFilename="Lumen/LumenDiffuseColorBoost.ush", DisplayName="Live Tweaks (Lumen diffuse boost guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/VolumetricFogVoxelization.usf", TemplateFilename="VolumetricFogVoxelization.usf", DisplayName="Live Tweaks (fog voxelization guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/VolumetricCloud.usf", TemplateFilename="VolumetricCloud.usf", DisplayName="Live Tweaks (volumetric cloud guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/HairStrands/HairStrandsMaterialCommon.ush", TemplateFilename="HairStrands/HairStrandsMaterialCommon.ush", DisplayName="Live Tweaks (hair strands guard)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/HeterogeneousVolumes/HeterogeneousVolumesLiveShadingUtils.ush", TemplateFilename="HeterogeneousVolumes/HeterogeneousVolumesLiveShadingUtils.ush", DisplayName="Live Tweaks (heterogeneous volumes guard)", RequiresGlobalRecompile=true)

