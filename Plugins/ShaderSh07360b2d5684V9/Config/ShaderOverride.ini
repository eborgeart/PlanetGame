+Define=(DefineName="CUSTOM_VOL_PHASE_G2", DisplayName="Dual-Lobe Secondary G", Description="Secondary anisotropy for Dual-Lobe HG (mode 3). Range -1..1.", DefaultValue="-0.3")
+Define=(DefineName="CUSTOM_VOL_PHASE_BLEND", DisplayName="Dual-Lobe Blend", Description="Blend between primary and secondary lobes for Dual-Lobe HG (mode 3). 0 = primary only, 1 = secondary only.", DefaultValue="0.3")
+Define=(DefineName="CUSTOM_VOL_MIE_DROPLET_UM", DisplayName="Mie Droplet (μm)", Description="Droplet diameter in micrometers for Mie-Approx phase function (mode 4). 5=fine mist, 15=fog, 50=light cloud, 100+=dense cloud", DefaultValue="15.0")
