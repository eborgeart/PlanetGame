; ShaderOverridePlugin_InMemory — Plugin Configuration
;
; This file defines which engine shaders to hook and what configurable
; #define values each one exposes in Project Settings > Plugins > Shader Override.
;
; The [Shaders] section lists every hook.  Each hook gets its own section
; (keyed by TemplateFilename) that lists the configurable defines.
;
; Users edit values in Project Settings; those values are persisted in the
; project's DefaultShaderOverride.ini.  The DefaultValue here is only used
; the first time a define appears.
;
; Well-known defines (CUSTOM_TONEMAP_MODE, AGX_LOOK, CUSTOM_DIFFUSE_MODE,
; CUSTOM_SPEC_MODE) are presented as typed UENUM dropdown menus in the
; settings panel.  All other defines appear as generic text fields.
;
; CUSTOM_DIFFUSE_MODE values (kept in sync with ECustomDiffuseMode in
; ShaderShiftSettings.h):
;     0 = Engine Default (Lambert / Chan / EON)
;     1 = Energy-conserving Oren-Nayar (QON)
;     2 = Disney Burley
;     3 = Lambert-Sphere [d'Eon 2021]
;     4 = Gotanda [tri-Ace]
;
; CUSTOM_SPEC_MODE values (kept in sync with ECustomSpecMode):
;     0 = Engine Default (Single-Lobe GGX)
;     1 = Multi-Lobe Cinematic
;
; When CUSTOM_SPEC_MODE = 1, the diffuse paths apply per-model dual-lobe
; energy compensation automatically.  See BRDF.ush header for the model.
;
; CUSTOM_BLOOM_MODE values (kept in sync with ECustomBloomMode):
;     0 = Engine Default
;     1 = Dual Kawase Blur
;     2 = COD Scatter-as-Gather (Karis 13 / Tent 9)
;     3 = FFT Diffraction Starburst
;     4 = Anamorphic Lens Streak
;     5 = Spencer Ocular PSF
;     6 = Anime / Toon Hard Glow
;     7 = Retro / CRT-style Glow
;
; The bloom mode flows through two engine shader files; each one is hooked
; below.  Both read CUSTOM_BLOOM_MODE from the same #define.  The kernel
; helpers are inlined directly into each patched shader (no shared header).
;
; CUSTOM_VOL_PHASE_MODE values (kept in sync with ECustomVolPhaseMode):
;     0 = Engine Default (Henyey-Greenstein, exact PBRT formulation)
;     1 = Schlick (cheaper HG approximation, ~30% faster)
;     2 = Cornette-Shanks (Mie improvement on HG)
;     3 = Dual-Lobe HG (sharp forward + soft secondary, follows VolumetricCloud.usf pattern)
;     4 = Jendersie & d'Eon 2023 Approximate Mie (closed-form Mie fit)
;
; All four call sites (directional, sky-SH, forward local lights, shadowed
; local lights) route through one PhaseFunction() wrapper inside the patched
; VolumetricFog.usf, so a single hook covers the whole pass.  CUSTOM_VOL_*
; tunables (G2, BLEND, MIE_DROPLET, POWDER_BLEND, BLUE_NOISE) live in the
; same hook section.

[Shaders]
+Shader=(VirtualPath="/Engine/Private/PostProcessCombineLUTs.usf", TemplateFilename="PostProcessCombineLUTs.usf", DisplayName="Tone Mapping")
+Shader=(VirtualPath="/Engine/Private/PostProcessTonemap.usf", TemplateFilename="PostProcessTonemap.usf", DisplayName="Film Halation + Organic Grain")
+Shader=(VirtualPath="/Engine/Private/TemporalAA.usf", TemplateFilename="TemporalAA.usf", DisplayName="Legacy TAA Ghosting + Sharpen", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/TemporalSuperResolution/TSRUpdateHistory.usf", TemplateFilename="TemporalSuperResolution/TSRUpdateHistory.usf", DisplayName="TSR Ghosting Tweak", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/Lumen/LumenScreenProbeGather.usf", TemplateFilename="LumenScreenProbeGather.usf", DisplayName="Lumen ReSTIR GI Probes", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/Lumen/LumenReflectionCommon.ush", TemplateFilename="LumenReflectionCommon.ush", DisplayName="Gradient Reflection Filter (Common)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/Lumen/LumenReflectionDenoiserSpatial.usf", TemplateFilename="LumenReflectionDenoiserSpatial.usf", DisplayName="Gradient Reflection Filter (Denoiser)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/VirtualShadowMaps/VirtualShadowMapProjectionFilter.ush", TemplateFilename="VirtualShadowMaps/VirtualShadowMapProjectionFilter.ush", DisplayName="Contact-Aware VSM Shadows", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/BRDF.ush", TemplateFilename="BRDF.ush", DisplayName="BRDF", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/ShadingModels.ush", TemplateFilename="ShadingModels.ush", DisplayName="Shading Models", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/Substrate/SubstrateEvaluation.ush", TemplateFilename="Substrate/SubstrateEvaluation.ush", DisplayName="Callisto Substrate BRDF (diffuse shaping / spec Fresnel falloff / per-material decode)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/BasePassPixelShader.usf", TemplateFilename="BasePassPixelShader.usf", DisplayName="Callisto Per-Material Encode (tuning + BRDF selection)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/PostProcessBloom.usf", TemplateFilename="PostProcessBloom.usf", DisplayName="Bloom")
+Shader=(VirtualPath="/Engine/Private/Bloom/BloomResizeKernel.usf", TemplateFilename="Bloom/BloomResizeKernel.usf", DisplayName="FFT Bloom Kernel")
+Shader=(VirtualPath="/Engine/Private/VolumetricFog.usf", TemplateFilename="VolumetricFog/VolumetricFog.usf", DisplayName="Volumetric Fog", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/HeightFogCommon.ush", TemplateFilename="VolumetricFog/HeightFogCommon.ush", DisplayName="Height Fog Common (analytic path)", RequiresGlobalRecompile=true)
+Shader=(VirtualPath="/Engine/Private/PostProcessAmbientOcclusion.usf", TemplateFilename="PostProcessAmbientOcclusion.usf", DisplayName="Ambient Occlusion")
+Shader=(VirtualPath="/Engine/Private/SSRT/SSRTDiffuseIndirect.usf", TemplateFilename="SSRT/SSRTDiffuseIndirect.usf", DisplayName="Screen-Space GI", RequiresGlobalRecompile=true)
